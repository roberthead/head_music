name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A rebase flow means force-pushes are routine; without this, each one leaves
# the superseded run burning minutes alongside its replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (ruby ${{ matrix.ruby-version }}, activesupport ${{ matrix.activesupport-version || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The corners of the supported range rather than a full cross product.
        # An empty activesupport-version installs from the lockfile, covering
        # the newest release the gemspec allows; ActiveSupport 7.2 is not
        # paired with Ruby 4.0, which it predates.
        include:
          - ruby-version: '3.3'
            activesupport-version: '7.2'
          - ruby-version: '3.3'
            activesupport-version: ''
            coverage: true
          - ruby-version: '3.4'
            activesupport-version: '7.2'
          - ruby-version: '3.4'
            activesupport-version: '8.0'
          - ruby-version: '4.0'
            activesupport-version: ''

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false

    - name: Install dependencies with ActiveSupport ${{ matrix.activesupport-version || 'latest' }}
      env:
        ACTIVESUPPORT_VERSION: ${{ matrix.activesupport-version }}
      run: |
        bundle config set --local path vendor/bundle
        bundle install

    - name: Run tests
      env:
        COVERAGE: ${{ matrix.coverage && 'true' || '' }}
      run: bundle exec rspec

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

  # Months of warning about upcoming Ruby releases, without a red check that
  # blocks a merge.
  test-ruby-head:
    name: test (ruby-head, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      # Bundler otherwise switches to the lockfile's BUNDLED WITH, and 2.7.2
      # raises "uninitialized constant Pathname::SEPARATOR_PAT" on a Ruby this
      # new. A bundler bug is not the breakage this job exists to find.
      BUNDLE_VERSION: system
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby head
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: head
        bundler: latest
        bundler-cache: false

    - name: Install dependencies
      run: |
        bundle config set --local path vendor/bundle
        bundle install

    - name: Run tests
      run: bundle exec rspec

  # The LilyPond specs treat the real binary as an oracle and skip when none is
  # installed, so without this job nothing proves the rendered documents
  # actually compile. Only the specs that call the binary run here; the test
  # job covers the rest.
  test-lilypond:
    name: test (with the lilypond toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Install LilyPond
      run: |
        sudo apt-get update
        sudo apt-get install -y lilypond
        lilypond --version

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec spec/head_music/notation/lily_pond_round_trip_spec.rb spec/head_music/notation/lily_pond

  # The schema specs skip unless a local schema is named, and the schemas are
  # not committed, so without this job nothing proves the MEI and MusicXML
  # documents are valid. Both are pinned; the MusicXML imports are pointed at
  # their local copies because the specs validate with --nonet.
  test-schemas:
    name: test (against the MEI and MusicXML schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEI_SCHEMA: ${{ github.workspace }}/schemas/mei-CMN.rng
      MUSICXML_XSD: ${{ github.workspace }}/schemas/musicxml.xsd
    steps:
    - uses: actions/checkout@v7

    - name: Install xmllint
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils

    - name: Fetch the schemas
      run: |
        mkdir -p schemas
        curl -sSfL -o schemas/mei-CMN.rng https://raw.githubusercontent.com/music-encoding/schema/bb4fed011f52088f8c2b9bdd4ff9674e75469aa4/5.1/mei-CMN.rng
        for file in musicxml.xsd xlink.xsd xml.xsd; do
          curl -sSfL -o "schemas/$file" "https://raw.githubusercontent.com/w3c/musicxml/799e2defb2ece0ae7bafe08dcbcac25b2c631d53/schema/$file"
        done
        sed -i 's#http://www.musicxml.org/xsd/##' schemas/musicxml.xsd

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec spec/head_music/notation/mei_schema_spec.rb spec/head_music/notation/music_xml_schema_spec.rb

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Build gem
      run: gem build *.gemspec

    - name: Check gem
      run: |
        gem install *.gem
        gem specification *.gem
