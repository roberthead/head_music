- Fux Cantus Firmus
- 'Write a cantus firmus: a singable line of eight to fourteen whole notes that begins
  and ends on the tonic.'
- Salzer–Schachter Cantus Firmus
- Write a cantus firmus with a single clear climax and stepwise motion away from every
  leap.
- Diatonic Melody
- Write a singable diatonic melody that stays in one key.
- First Species Melody
- Write one whole note against each note of the cantus firmus.
- First Species Harmony
- Set your line against the cantus firmus in consonances, moving mostly in contrary
  motion.
- Second Species Melody
- Write two half notes in each bar against the cantus firmus.
- Second Species Harmony
- Place a consonance on each downbeat, and pass through dissonance only by step on
  the weak beat.
- Third Species Melody
- Write four quarter notes in each bar against the cantus firmus.
- Third Species Harmony
- Keep the downbeats consonant, and treat the quarter-note dissonances as passing
  or neighbor tones.
- Third Species Triple Meter Melody
- Write three quarter notes in each bar against the cantus firmus.
- Third Species Triple Meter Harmony
- Keep the downbeats consonant in triple meter, and resolve every dissonance by step.
- Fourth Species Melody
- Tie each note across the barline, suspending it into the next bar.
- Fourth Species Harmony
- Prepare each suspension as a consonance and resolve it downward by step.
- First Three Species Melody
- Combine whole, half and quarter notes in one line, changing rhythm between phrases.
- First Three Species Harmony
- Set a mixed-rhythm line against the cantus firmus, keeping each downbeat consonant.
- Fifth Species Melody
- 'Write florid counterpoint: mix note values and ties as the line requires.'
