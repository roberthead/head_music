- Fux Cantus Firmus
- 'Write a cantus firmus: a singable line of eight to fourteen whole notes that begins
  and ends on the tonic.'
- Salzer–Schachter Cantus Firmus
- Write a cantus firmus with a single clear climax and stepwise motion away from every
  leap.
- Diatonic Melody
- Write a singable diatonic melody that stays in one key.
- First Species Melody
- Write one whole note against each note of the cantus firmus.
- First Species Harmony
- Set your line against the cantus firmus in consonances, moving mostly in contrary
  motion.
- Second Species Melody
- Write two half notes in each bar against the cantus firmus.
- Second Species Harmony
- Place a consonance on each downbeat, and pass through dissonance only by step on
  the weak beat.
- Third Species Melody
- Write four quarter notes in each bar against the cantus firmus.
- Third Species Harmony
- Keep the downbeats consonant, and treat the quarter-note dissonances as passing
  or neighbor tones.
- Third Species Triple Meter Melody
- Write three quarter notes in each bar against the cantus firmus.
- Third Species Triple Meter Harmony
- Keep the downbeats consonant in triple meter, and resolve every dissonance by step.
- Fourth Species Melody
- Tie each note across the barline, suspending it into the next bar.
- Fourth Species Harmony
- Prepare each suspension as a consonance and resolve it downward by step.
- First Three Species Melody
- Combine whole, half and quarter notes in one line, changing rhythm between phrases.
- First Three Species Harmony
- Set a mixed-rhythm line against the cantus firmus, keeping each downbeat consonant.
- Fifth Species Melody
- 'Write florid counterpoint: mix note values and ties as the line requires.'
- Fifth Species Harmony
- Write florid counterpoint against the cantus firmus, treating every dissonance as
  its figure demands.
- Free Species Melody
- Write each line in the species' note values, any of them in any bar, closing by
  step on the tonic.
- Free Species Harmony
- Write two lines together with no cantus firmus, explaining every dissonance between
  them, keeping their textures apart, and closing with the clausula vera.
- Arch Contour Melody
- Write a melody that rises to a single peak and falls back.
- Ascending Contour Melody
- Write a melody that begins at its lowest note and ends at its highest.
- Descending Contour Melody
- Write a melody that begins at its highest note and ends at its lowest.
- Static Contour Melody
- Write a melody that stays within a narrow range and returns to where it began.
- Valley Contour Melody
- Write a melody that falls to a single low point and rises back.
- Wave Contour Melody
- Write a melody that changes direction three or more times.
- First Species
- Write one whole note against each note of the cantus firmus, consonant with it and
  moving mostly in contrary motion.
- Second Species
- Write two half notes in each bar, placing a consonance on each downbeat and passing
  through dissonance only by step.
- Third Species
- Write four quarter notes in each bar, keeping every downbeat consonant and treating
  each dissonance as a passing or neighbor tone.
- Third Species Triple Meter
- Write three quarter notes in each bar of triple meter, keeping every downbeat consonant
  and resolving each dissonance by step.
- Fourth Species
- Tie each note across the barline, preparing every suspension as a consonance and
  resolving it downward by step.
- Fifth Species
- Write florid counterpoint against the cantus firmus, mixing note values and ties
  as the line requires and treating every dissonance as its figure demands.
- First Three Species
- Combine whole, half and quarter notes in one line, keeping every downbeat consonant
  as the rhythm changes.
- Free Species
- 'Compose two voices together in the techniques of the species. No cantus firmus
  is given: where species counterpoint sets a line against a fixed song, here you
  write both lines, mixing note values freely and treating every dissonance between
  them as its figure demands. ("Free species" is this guide''s own name.)'
