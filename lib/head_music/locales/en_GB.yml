en_GB:
  head_music:
    # The note values, which differ in vocabulary rather than spelling. They sit
    # under rudiments because the vocabulary belongs to the rudiment: the style
    # sentences borrow the words, they do not own them.
    #
    # Still not on Rudiment::RhythmicUnit itself, because that class's #name is
    # an identifier -- duration arithmetic, grading and MusicXML export all
    # index by it -- not a label to localize.
    #
    # Moving the namespace does not move the pin: render_template still builds
    # values in the locale carrying the *sentence*, so these entries are
    # consulted only because the note_count_per_bar entries under style are
    # here too. Giving a locale its own note values still means giving it the
    # sentences that name them.
    #
    # Note that de, fr, it and ru route through here on their way to en, so a
    # pluralized entry added below must carry the locale's complete set of
    # plural forms -- a partial hash stops the fallback rather than continuing
    # past it, and would break those four languages rather than this one. They
    # inherit the British note values deliberately; note-values-in-each-language
    # gives them their own.
    rudiments:
      grand_staff: great staff
      # British names the value with a noun, so the note value and the rhythmic
      # unit are the same word: a crotchet, where American has a quarter and a
      # quarter note. Rests do not follow -- there is no one-word British name
      # for a rest, so these keep the noun the note values drop.
      note_values:
        double_whole: "breve"
        eighth: "quaver"
        half: "minim"
        hundred_twenty_eighth: "semihemidemisemiquaver"
        longa: "longa"
        quarter: "crotchet"
        sixteenth: "semiquaver"
        sixty_fourth: "hemidemisemiquaver"
        thirty_second: "demisemiquaver"
        whole: "semibreve"
      rest_values:
        double_whole: "breve rest"
        eighth: "quaver rest"
        half: "minim rest"
        hundred_twenty_eighth: "semihemidemisemiquaver rest"
        longa: "longa rest"
        quarter: "crotchet rest"
        sixteenth: "semiquaver rest"
        sixty_fourth: "hemidemisemiquaver rest"
        thirty_second: "demisemiquaver rest"
        whole: "semibreve rest"
      # Pluralized where note_values above is scalar: note_count_per_bar counts
      # these and drops the noun, so the word itself has to pluralize.
      rhythmic_units:
        double_whole:
          one: "breve"
          other: "breves"
        eighth:
          one: "quaver"
          other: "quavers"
        half:
          one: "minim"
          other: "minims"
        hundred_twenty_eighth:
          one: "semihemidemisemiquaver"
          other: "semihemidemisemiquavers"
        longa:
          one: "longa"
          other: "longas"
        quarter:
          one: "crotchet"
          other: "crotchets"
        sixteenth:
          one: "semiquaver"
          other: "semiquavers"
        sixty_fourth:
          one: "hemidemisemiquaver"
          other: "hemidemisemiquavers"
        thirty_second:
          one: "demisemiquaver"
          other: "demisemiquavers"
        whole:
          one: "semibreve"
          other: "semibreves"
    # The strings whose spelling differs -- neighbour, metre, a bar rather than
    # a measure. Everything else falls through to en.
    #
    # The note values need whole sentences here, not just the words above:
    # British names the value with a noun and drops the "note" the American
    # sentence carries -- four crotchets, not four crotchet notes -- so the
    # sentence changes shape, not only vocabulary.
    style:
      guidelines:
        allow_fifth_species_rhythmic_values:
          instruction: "Write in minims, crotchets, and paired stepwise quavers on weak beats, saving the semibreve for the final bar."
          violations:
            default: "Use only semibreves in the final bar, minims, crotchets, and paired stepwise quavers on weak beats."
        allow_whole_half_quarter_notes:
          name: "Semibreves, minims, and crotchets only"
          instruction: "Write in semibreves, minims, and crotchets."
          violations:
            default: "Use only semibreves, minims, and crotchets."
        first_bar_half_notes:
          name: "Minims in the first bar"
          instruction: "Open the first bar with minims, or enter after a minim rest."
          violations:
            default: "Begin the first bar with minims, or enter after a minim rest."
        first_bar_quarter_notes:
          name: "Crotchets in the first bar"
          instruction: "Open the first bar with crotchets, or enter after a crotchet rest."
          violations:
            default: "Begin the first bar with crotchets, or enter after a crotchet rest."
        first_bar_whole_note:
          name: "Semibreve in the first bar"
          instruction: "Open with a semibreve in the first bar."
          violations:
            default: "Begin with a semibreve in the first bar."
        florid_dissonance_treatment:
          instruction: "Reach every dissonance as a passing tone, cambiata, or double neighbour on a weak beat, and prepare and resolve every tied suspension."
          violations:
            default: "Treat each dissonance as a passing tone, cambiata, or double neighbour on a weak beat, and prepare and resolve every tied suspension."
        no_rests:
          instruction: "Sound a note in every bar."
          violations:
            default: "Place a note in each bar."
        note_count_per_bar:
          name: "%{number} %{rhythmic_unit} per bar"
          instruction: "Write %{number} %{rhythmic_unit} in each middle bar."
          violations:
            default: "Use %{number} %{rhythmic_unit} in each middle bar."
        third_species_dissonance_treatment:
          instruction: "Reach every dissonance as a passing tone, neighbour tone, cambiata, or double neighbour figure."
          violations:
            default: "Treat dissonances as passing tones, neighbour tones, cambiata, or double neighbour figures."
        triple_meter_dissonance_treatment:
          name: "Triple metre dissonance treatment"
          instruction: "Reach every dissonance as a passing tone or a neighbour tone."
          violations:
            default: "Treat dissonances as passing tones or neighbour tones."
      guides:
        # Composite guides whose English instruction names an American note
        # value. fourth_species and fifth_species name none and are not listed.
        first_species:
          instruction: "Write one semibreve against each note of the cantus firmus, consonant with it and moving mostly in contrary motion."
        first_three_species:
          instruction: "Combine semibreves, minims and crotchets in one line, keeping every downbeat consonant as the rhythm changes."
        second_species:
          instruction: "Write two minims in each bar, placing a consonance on each downbeat and passing through dissonance only by step."
        third_species:
          instruction: "Write four crotchets in each bar, keeping every downbeat consonant and treating each dissonance as a passing or neighbouring tone."
        third_species_triple_meter:
          instruction: "Write three crotchets in each bar of triple metre, keeping every downbeat consonant and resolving each dissonance by step."
        first_species_melody:
          instruction: "Write one semibreve against each note of the cantus firmus."
        first_three_species_melody:
          instruction: "Combine semibreves, minims and crotchets in one line, changing rhythm between phrases."
        fux_cantus_firmus:
          instruction: "Write a cantus firmus: a singable line of eight to fourteen semibreves that begins and ends on the tonic."
        second_species_melody:
          instruction: "Write two minims in each bar against the cantus firmus."
        third_species_harmony:
          instruction: "Keep the downbeats consonant, and treat the crotchet dissonances as passing or neighbour tones."
        third_species_melody:
          instruction: "Write four crotchets in each bar against the cantus firmus."
        third_species_triple_meter_harmony:
          instruction: "Keep the downbeats consonant in triple metre, and resolve every dissonance by step."
        third_species_triple_meter_melody:
          instruction: "Write three crotchets in each bar against the cantus firmus."
