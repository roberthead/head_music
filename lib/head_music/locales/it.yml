    # Infinito ovunque: «Scrivere in semibrevi e minime.» Evita la scelta fra tu
    # e Lei, che nessuna specifica puo verificare, ed e idiomatico per una regola.
    #
    # La coppia scrivere/usare porta cio che l'inglese distingue con Write/Use.
    #
    # render_name porta in maiuscola la prima lettera: guidelines.*.name inizia
    # quindi in minuscolo.
    style:
      guidelines:
        allow_fifth_species_rhythmic_values:
          instruction: "Scrivere in minime, semiminime e crome congiunte appaiate sui tempi deboli, riservando la semibreve alla battuta finale."
          violations:
            default: "Usare solo semibrevi nella battuta finale, e minime, semiminime e crome congiunte appaiate sui tempi deboli."
        allow_whole_half_quarter_notes:
          name: "solo semibrevi, minime e semiminime"
          instruction: "Scrivere in semibrevi, minime e semiminime."
          violations:
            default: "Usare solo semibrevi, minime e semiminime."
        first_bar_half_notes:
          name: "minime nella prima battuta"
          instruction: "Aprire la prima battuta con minime, oppure entrare dopo una pausa di minima."
          violations:
            default: "Iniziare la prima battuta con minime, oppure entrare dopo una pausa di minima."
        first_bar_quarter_notes:
          name: "semiminime nella prima battuta"
          instruction: "Aprire la prima battuta con semiminime, oppure entrare dopo una pausa di semiminima."
          violations:
            default: "Iniziare la prima battuta con semiminime, oppure entrare dopo una pausa di semiminima."
        first_bar_whole_note:
          name: "semibreve nella prima battuta"
          instruction: "Aprire la prima battuta con una semibreve."
          violations:
            default: "Iniziare la prima battuta con una semibreve."
        note_count_per_bar:
          name: "%{number} %{rhythmic_unit} per battuta"
          instruction: "In ogni battuta intermedia, scrivere %{number} %{rhythmic_unit}."
          violations:
            default: "In ogni battuta intermedia, usare %{number} %{rhythmic_unit}."
      guides:
        first_species:
          instruction: "Scrivere una semibreve contro ogni nota del cantus firmus, consonante con essa e per lo piu in moto contrario."
        first_species_melody:
          instruction: "Scrivere una semibreve contro ogni nota del cantus firmus."
        first_three_species:
          instruction: "Combinare semibrevi, minime e semiminime in una sola linea, mantenendo consonante ogni tempo forte mentre il ritmo cambia."
        first_three_species_melody:
          instruction: "Combinare semibrevi, minime e semiminime in una sola linea, cambiando ritmo tra le frasi."
        fux_cantus_firmus:
          instruction: "Scrivere un cantus firmus: una linea cantabile da otto a quattordici semibrevi che inizia e termina sulla tonica."
        second_species:
          instruction: "Scrivere due minime per battuta, ponendo una consonanza su ogni tempo forte e attraversando la dissonanza solo per grado congiunto."
        second_species_melody:
          instruction: "Scrivere due minime per battuta contro il cantus firmus."
        third_species:
          instruction: "Scrivere quattro semiminime per battuta, mantenendo consonante ogni tempo forte e trattando ogni dissonanza come nota di passaggio o di volta."
        third_species_harmony:
          instruction: "Mantenere consonanti i tempi forti e trattare le dissonanze delle semiminime come note di passaggio o di volta."
        third_species_melody:
          instruction: "Scrivere quattro semiminime per battuta contro il cantus firmus."
        third_species_triple_meter:
          instruction: "Scrivere tre semiminime in ogni battuta ternaria, mantenendo consonante ogni tempo forte e risolvendo ogni dissonanza per grado congiunto."
        third_species_triple_meter_melody:
          instruction: "Scrivere tre semiminime per battuta contro il cantus firmus."
