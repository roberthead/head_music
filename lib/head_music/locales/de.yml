      rhythm: Rhythmus
      rhythmic_unit: rhythmische Einheit
      # Die kurzen substantivierten Formen -- so sprechen Musiker. Nach einem
      # Zahlwort bleibt der Plural unverändert: zwei Halbe, vier Viertel. Dass
      # one und other dieselbe Zeichenkette tragen, ist richtig und kein
      # Kopierfehler. Nur Longa und Brevis bilden als lateinische Lehnwörter
      # einen eigenen Plural.
      rhythmic_units:
        double_whole:
          one: "Brevis"
          other: "Breven"
        eighth:
          one: "Achtel"
          other: "Achtel"
        half:
          one: "Halbe"
          other: "Halbe"
        hundred_twenty_eighth:
          one: "Hundertachtundzwanzigstel"
          other: "Hundertachtundzwanzigstel"
        longa:
          one: "Longa"
          other: "Longen"
        maxima:
          one: "Maxima"
          other: "Maximen"
        quarter:
          one: "Viertel"
          other: "Viertel"
        sixteenth:
          one: "Sechzehntel"
          other: "Sechzehntel"
        sixty_fourth:
          one: "Vierundsechzigstel"
          other: "Vierundsechzigstel"
        thirty_second:
          one: "Zweiunddreißigstel"
          other: "Zweiunddreißigstel"
        whole:
          one: "Ganze"
          other: "Ganze"
