      # Deutsch setzt nicht durchgängig zusammen: ganz und halb sind Adjektive
      # und bleiben getrennte Wörter, Viertel und Achtel sind Substantive und
      # bilden Komposita. Der Bruch liegt zwischen der Halben und dem Viertel,
      # bei den Pausen genauso.
      note_values:
        double_whole: "Brevis"
        eighth: "Achtelnote"
        half: "halbe Note"
        hundred_twenty_eighth: "Hundertachtundzwanzigstelnote"
        longa: "Longa"
        maxima: "Maxima"
        quarter: "Viertelnote"
        sixteenth: "Sechzehntelnote"
        sixty_fourth: "Vierundsechzigstelnote"
        thirty_second: "Zweiunddreißigstelnote"
        whole: "ganze Note"
