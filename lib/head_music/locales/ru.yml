    # Spelled out for %{number}, because the humanize gem ships no Italian at all
    # and the forms it does ship are wrong here: capitalized mid-sentence for
    # German, and masculine where the nouns being counted -- note values, and
    # notes -- are feminine in all five of these languages.
    #
    # Only 1, and 2 in Russian, inflect for gender; every larger number here is
    # invariant. The counts are the ones the registry actually renders, guarded
    # by a spec, so a guideline introducing a new one fails rather than quietly
    # falling back to an English word.
    number_words:
      "1": "одна"
      "2": "две"
      "3": "три"
      "4": "четыре"
      "5": "пять"
      "8": "восемь"
      "14": "четырнадцать"
      "32": "тридцать два"
    rudiments:
      alteration: альтерация
      chromatic_interval: хроматический интервал
      circle: круг
      clef: ключ
      consonance: консонанс
      diatonic_interval: диатонический интервал
      grand_staff: большой нотный стан
      harmonic_interval: гармонический интервал
      instrument: инструмент
      interval_cycle: цикл интервалов
      key_signature: тональность
      letter_name: названия нот
      melodic_interval: мелодический интервал
      meter: метр
      motion: движение
      musical_symbol: музыкальный символ
      note: нота
      # Прилагательные согласуются с «нотой», поэтому имя длительности и имя
      # ноты совпадают у дробных значений. Латинские заимствования --
      # максима, лонга, бревис -- существительные и стоят без «ноты».
      note_values:
        double_whole: "бревис"
        eighth: "восьмая нота"
        half: "половинная нота"
        hundred_twenty_eighth: "сто двадцать восьмая нота"
        longa: "лонга"
        maxima: "максима"
        quarter: "четвертная нота"
        sixteenth: "шестнадцатая нота"
        sixty_fourth: "шестьдесят четвёртая нота"
        thirty_second: "тридцать вторая нота"
        whole: "целая нота"
      octave: октава
      pitch: высота звука
      pitch_class: класс высоты звука
      pitch_class_set: набор классов высоты звука
      pitch_set: набор высот звука
      quality: качество
      reference_pitch: эталонная высота звука
      rest: пауза
      # У дробных значений прилагательное согласуется с «паузой». У латинских
      # заимствований согласование невозможно, поэтому используется
      # родительный падеж: пауза максимы. Ещё один переход внутри одного языка.
      rest_values:
        double_whole: "пауза бревиса"
        eighth: "восьмая пауза"
        half: "половинная пауза"
        hundred_twenty_eighth: "сто двадцать восьмая пауза"
        longa: "пауза лонги"
        maxima: "пауза максимы"
        quarter: "четвертная пауза"
        sixteenth: "шестнадцатая пауза"
        sixty_fourth: "шестьдесят четвёртая пауза"
        thirty_second: "тридцать вторая пауза"
        whole: "целая пауза"
      rhythm: ритм
      rhythmic_unit: ритмическая единица
      # Три формы, а не две: one для 1 и 21, few для 2-4 и 22-24, many для
      # 5-20. Ключа other нет намеренно -- его отсутствие и включает правило
      # в Template::PLURAL_RULES, потому что Backend::Simple знает только
      # английское one/other и без этого вернул бы other для 2, 3 и 5.
      rhythmic_units:
        double_whole:
          one: "бревис"
          few: "бревиса"
          many: "бревисов"
        eighth:
          one: "восьмая"
          few: "восьмые"
          many: "восьмых"
        half:
          one: "половинная"
          few: "половинные"
          many: "половинных"
        hundred_twenty_eighth:
          one: "сто двадцать восьмая"
          few: "сто двадцать восьмые"
          many: "сто двадцать восьмых"
        longa:
          one: "лонга"
          few: "лонги"
          many: "лонг"
        maxima:
          one: "максима"
          few: "максимы"
          many: "максим"
        quarter:
          one: "четвертная"
          few: "четвертные"
          many: "четвертных"
        sixteenth:
          one: "шестнадцатая"
          few: "шестнадцатые"
          many: "шестнадцатых"
        sixty_fourth:
          one: "шестьдесят четвёртая"
          few: "шестьдесят четвёртые"
          many: "шестьдесят четвёртых"
        thirty_second:
          one: "тридцать вторая"
          few: "тридцать вторые"
          many: "тридцать вторых"
        whole:
          one: "целая"
          few: "целые"
          many: "целых"
      scale: гамма
      scale_degree: ступень гаммы
      scale_type: тип гаммы
      solfege: сольфеджио
      solmization: сольмизация
      sonority: звучность
      spelling: обозначение
      staff: нотный стан
      tuba: туба
      tuning: настройка
    # Инфинитив везде: «Писать целыми и половинными.» Это снимает выбор между
    # ты и вы, который никакая спецификация проверить не может.
    #
    # Пара писать/использовать несёт то, что английский различает через
    # Write/Use: правило против замечания.
    #
    # Падежи стоят в предложении, а не в словаре. Здесь творительный падеж
    # (целыми, половинными) и родительный после «после» (половинной паузы),
    # тогда как rhythmic_units хранит именительный.
    #
    # Поэтому note_count_per_bar построен назывным оборотом, без глагола:
    # «писать» требует винительного падежа, и единственное число вышло бы как
    # «писать одна целая» вместо «одну целую». Множественное было бы верным
    # (винительный неодушевлённых совпадает с именительным), но одна форма
    # словаря не может обслуживать оба числа.
    #
    # render_name делает первую букву заглавной: guidelines.*.name начинается
    # со строчной.
    style:
      guidelines:
        allow_fifth_species_rhythmic_values:
          instruction: "Писать половинными, четвертными и парными плавными восьмыми на слабых долях, оставляя целую для последнего такта."
          violations:
            default: "Использовать только целые в последнем такте, половинные, четвертные и парные плавные восьмые на слабых долях."
        allow_whole_half_quarter_notes:
          name: "только целые, половинные и четвертные"
          instruction: "Писать целыми, половинными и четвертными."
          violations:
            default: "Использовать только целые, половинные и четвертные."
        first_bar_half_notes:
          name: "половинные в первом такте"
          instruction: "Открывать первый такт половинными или вступать после половинной паузы."
          violations:
            default: "Начинать первый такт половинными или вступать после половинной паузы."
        first_bar_quarter_notes:
          name: "четвертные в первом такте"
          instruction: "Открывать первый такт четвертными или вступать после четвертной паузы."
          violations:
            default: "Начинать первый такт четвертными или вступать после четвертной паузы."
        first_bar_whole_note:
          name: "целая в первом такте"
          instruction: "Открывать первый такт целой."
          violations:
            default: "Начинать первый такт целой."
        note_count_per_bar:
          name: "%{number} %{rhythmic_unit} в такте"
          instruction: "В каждом среднем такте — %{number} %{rhythmic_unit}."
          violations:
            default: "В каждом среднем такте — ровно %{number} %{rhythmic_unit}."
      guides:
        first_species:
          instruction: "Писать одну целую против каждой ноты cantus firmus, консонирующую с ней и преимущественно в противоположном движении."
        first_species_melody:
          instruction: "Писать одну целую против каждой ноты cantus firmus."
        first_three_species:
          instruction: "Сочетать целые, половинные и четвертные в одной линии, сохраняя каждую сильную долю консонирующей по мере смены ритма."
        first_three_species_melody:
          instruction: "Сочетать целые, половинные и четвертные в одной линии, меняя ритм между фразами."
        fux_cantus_firmus:
          instruction: "Писать cantus firmus: певучую линию от восьми до четырнадцати целых, начинающуюся и заканчивающуюся на тонике."
        second_species:
          instruction: "Писать две половинные в каждом такте, помещая консонанс на каждую сильную долю и проходя диссонанс только плавно."
        second_species_melody:
          instruction: "Писать две половинные в каждом такте против cantus firmus."
        third_species:
          instruction: "Писать четыре четвертные в каждом такте, сохраняя каждую сильную долю консонирующей и трактуя каждый диссонанс как проходящий или вспомогательный тон."
        third_species_harmony:
          instruction: "Сохранять сильные доли консонирующими и трактовать диссонансы четвертных как проходящие или вспомогательные тоны."
        third_species_melody:
          instruction: "Писать четыре четвертные в каждом такте против cantus firmus."
        third_species_triple_meter:
          instruction: "Писать три четвертные в каждом трёхдольном такте, сохраняя каждую сильную долю консонирующей и разрешая каждый диссонанс плавно."
        third_species_triple_meter_melody:
          instruction: "Писать три четвертные в каждом такте против cantus firmus."
